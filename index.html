<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#2F7FC9">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="mobile-web-app-capable" content="yes">
<title>Little Engineer</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="ui" hidden>
    <button id="btn-camera" type="button" aria-label="Change the view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        <circle cx="12" cy="12.5" r="3.5"/>
      </svg>
    </button>

    <button id="btn-whistle" type="button" aria-label="Whistle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3l4-3v11l-4-3H4Z" fill="currentColor"/>
        <path d="M15 8.5a5 5 0 0 1 0 7"/>
        <path d="M18 5.5a9 9 0 0 1 0 13"/>
      </svg>
    </button>

    <!-- Push up to go, let go to roll gently down, pull down to stop. -->
    <div id="lever" role="slider" tabindex="0" aria-label="Throttle"
         aria-orientation="vertical" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
      <div class="zones">
        <div class="zone zone-go">
          <svg viewBox="0 0 24 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 13 12 6l7 7"/>
            <path d="M5 21l7-7 7 7"/>
            <path d="M5 29l7-7 7 7"/>
          </svg>
        </div>
        <div class="zone zone-coast">
          <svg viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M5 5h14"/>
            <path d="M8 10h8"/>
          </svg>
        </div>
        <div class="zone zone-stop">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="5.5" y="5.5" width="13" height="13" rx="3"/>
          </svg>
        </div>
      </div>
      <div class="slot"><div class="knob"></div></div>
    </div>
  </div>

  <div id="boot">
    <div class="boot-face"></div>
    <p id="boot-hello"></p>
    <div class="boot-bar"><i></i></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
