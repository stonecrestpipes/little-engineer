name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The floor for anything added later. Each job then asks for what it actually
# needs, because the two jobs here do not deserve the same trust: `build` runs
# `npm ci`, which executes dependency install scripts, so it is the one place
# where third-party code runs. It must not be able to publish. Only `deploy`
# holds the tokens that can change what the tablet loads.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages only reads the site's metadata here: `enablement` is
      # left at false, and nothing in this job uses its outputs.
      pages: read
    steps:
      # Pinned to commit SHAs rather than tags. A tag can be moved to new code
      # by whoever owns the action, and this workflow decides what a four-year
      # -old's tablet downloads, so it should not be able to change under us.
      # The trailing comment is the tag each SHA was taken from; to update one,
      # re-resolve the tag rather than editing the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The junctions and the platform stops are the two things most likely
      # to break quietly, and a broken one should never reach the tablet.
      - run: npm test
      - run: npm run build
        env:
          # Project sites live at /<repo>/, so every asset URL needs that
          # prefix or the page loads and nothing else does.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can publish, and it runs nothing but the action below:
    # no checkout, no install, no project code.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
