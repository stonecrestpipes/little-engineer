<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#2F7FC9">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="mobile-web-app-capable" content="yes">
<title>Little Engineer</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="ui" hidden>
    <button id="btn-camera" type="button" aria-label="Change the view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        <circle cx="12" cy="12.5" r="3.5"/>
      </svg>
    </button>

    <!-- Which build this is, for whoever hands him the tablet. He cannot read
         it, it cannot be pressed, and it is the last thing in the tab order. -->
    <div id="version" aria-hidden="true"></div>

    <button id="btn-whistle" type="button" aria-label="Whistle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3l4-3v11l-4-3H4Z" fill="currentColor"/>
        <path d="M15 8.5a5 5 0 0 1 0 7"/>
        <path d="M18 5.5a9 9 0 0 1 0 13"/>
      </svg>
    </button>

    <!-- The two that talk, stood above the whistle: the left corner is where
         every noise in the game comes from. -->
    <button id="btn-aboard" class="say" type="button" data-say="0" aria-label="Say all aboard">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9l-6 5v-5H8a3 3 0 0 1-3-3Z"/>
        <circle cx="16" cy="9.5" r="2.1" fill="currentColor" stroke="none"/>
        <path d="M16 12.6v4M12.8 14.4h6.4M14 20l2-3.4 2 3.4"/>
      </svg>
    </button>

    <button id="btn-steam" class="say" type="button" data-say="1" aria-label="Say full steam ahead">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 11a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-6 5v-5H8a3 3 0 0 1-3-3Z"/>
        <circle cx="12.5" cy="15" r="2.4" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="14.2" r="3" fill="currentColor" stroke="none"/>
        <circle cx="23" cy="15.4" r="2" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <!-- Only there while he is coming up to a set of points. Each way is an
         arrow and a picture of where it goes; nothing to read. The pictures
         shown are the ones for whichever junction it is. -->
    <div id="points" hidden>
      <button class="way" data-line="0" type="button" aria-label="The main line">
        <svg viewBox="0 0 64 88" aria-hidden="true">
          <g class="pic" data-for="coast">
            <path d="M14 32V19l18-9 18 9v13Z" fill="#c36552"/>
            <path d="M11 20l21-11 21 11" fill="none" stroke="#6b4a3e" stroke-width="4" stroke-linejoin="round"/>
            <path d="M26 32v-8h12v8Z" fill="#26323a"/>
          </g>
          <g class="pic" data-for="farm">
            <path d="M12 30V20a20 16 0 0 1 40 0v10Z" fill="#8a7a66"/>
            <path d="M21 30v-8a11 9 0 0 1 22 0v8Z" fill="#26323a"/>
          </g>
          <path class="arrow" d="M40 82V64q0-12-12-12h-6" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="arrow" d="M26 41 14 52l12 11" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="way" data-line="1" type="button" aria-label="The branch line">
        <svg viewBox="0 0 64 88" aria-hidden="true">
          <g class="pic" data-for="coast">
            <path d="M27 34l2-22h6l2 22Z" fill="#f4f1e8" stroke="#d9573f" stroke-width="1.5"/>
            <path d="M28 27h8M28.6 20h6.8" stroke="#d9573f" stroke-width="4"/>
            <path d="M27.5 12h9v-4h-9Z" fill="#ffd66b"/>
            <path d="M26 8l6-4 6 4Z" fill="#d9573f"/>
            <path d="M38 9l12-4M38 11l12 4" stroke="#ffd66b" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="pic" data-for="farm">
            <path d="M26 32l2-16h8l2 16Z" fill="#f4f1e8" stroke="#9e4a3c" stroke-width="1.5"/>
            <path d="M25 17l7-6 7 6Z" fill="#9e4a3c"/>
            <g stroke="#8d6e4e" stroke-width="3" stroke-linecap="round">
              <path d="M32 18 21 7M32 18l11-11M32 18 21 29M32 18l11 11"/>
            </g>
          </g>
          <path class="arrow" d="M32 82V46" fill="none" stroke-width="8" stroke-linecap="round"/>
          <path class="arrow" d="M20 54 32 42l12 12" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Green to go, green again for full steam, red to stop. R backs up for
         as long as it is held, and lets go the moment he does. -->
    <div id="drive">
      <button id="btn-go" type="button" data-notch="0" aria-label="Go">
        <svg viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="chev chev-more" d="M5 12 12 5l7 7"/>
          <path class="chev" d="M5 25l7-7 7 7"/>
        </svg>
      </button>

      <button id="btn-stop" type="button" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="5.5" y="5.5" width="13" height="13" rx="3"/>
        </svg>
      </button>

      <button id="btn-back" type="button" aria-label="Back up">
        <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17V5h5.6a3.2 3.2 0 0 1 0 6.6H12m4.6 0L21.5 17"/>
          <path d="M24 27H11m0 0 4.2-4.2M11 27l4.2 4.2"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="boot">
    <div class="boot-face"></div>
    <p id="boot-hello"></p>
    <div class="boot-bar"><i></i></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
